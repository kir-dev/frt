services:
  postgres:
    restart: always
    image: docker.io/postgres:17-alpine
    volumes:
      - postgres:/var/lib/postgresql/data
    env_file:
      - ${APP_ENV_FILE:-.env}
    networks:
      - postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 1s
      timeout: 10s
      start_period: 10s
      retries: 10

  app:
    restart: always
    image: ${FRT_APP_IMAGE:-frt-app:local}
    ports:
      - "127.0.0.1:3000:3000"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - frt:/app/media
      - ./public/videos:/app/public/videos
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env}
    networks:
      - postgres
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  postgres:
  frt:

networks:
  postgres:
    driver: bridge
